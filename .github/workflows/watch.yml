name: needle-watch
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: needle-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy pandas
      - name: Check for new photos
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          PERMISSION_CONFIRMED: ${{ vars.PERMISSION_CONFIRMED }}
          DATA_DIR: data
        run: python watch.py
      - name: Save results back to the repo
        if: always()
        run: |
          git config user.name "needle-watch"
          git config user.email "needle-watch@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "watch: update photo log" && git pull --rebase -q && git push -q)
